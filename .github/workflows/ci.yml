name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, exif
          coverage: pcov

      # Every Illuminate component in composer.json's require block is pinned
      # to the matrix version BY NAME. tests/DependencyPinTest.php compares the
      # two files and fails when a require lands without its pin here.
      - name: Install dependencies
        run: |
          composer require \
            "illuminate/auth:${{ matrix.laravel }}" \
            "illuminate/bus:${{ matrix.laravel }}" \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/queue:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/validation:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  filament:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        filament: ['^4.13.3', '^5.8.3']

    name: Filament ${{ matrix.filament }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, exif
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require \
            "illuminate/auth:12.*" \
            "illuminate/bus:12.*" \
            "illuminate/console:12.*" \
            "illuminate/database:12.*" \
            "illuminate/http:12.*" \
            "illuminate/queue:12.*" \
            "illuminate/routing:12.*" \
            "illuminate/support:12.*" \
            "illuminate/validation:12.*" \
            "orchestra/testbench:10.*" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  no-optional:
    runs-on: ubuntu-latest
    name: Without Filament, Horizon, Pulse and Telescope

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, exif
          coverage: none

      - name: Install dependencies
        run: |
          composer remove --dev filament/filament laravel/horizon laravel/pulse laravel/telescope --no-interaction --no-update
          composer require \
            "illuminate/auth:12.*" \
            "illuminate/bus:12.*" \
            "illuminate/console:12.*" \
            "illuminate/database:12.*" \
            "illuminate/http:12.*" \
            "illuminate/queue:12.*" \
            "illuminate/routing:12.*" \
            "illuminate/support:12.*" \
            "illuminate/validation:12.*" \
            "orchestra/testbench:10.*" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  pgsql:
    runs-on: ubuntu-latest
    name: PostgreSQL support locks

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # SQLite ignores `for update`; only a real PostgreSQL shows a dropped row lock.
      # AiRunResource rides along: PostgreSQL alone puts nulls first in a descending sort.
      # RewriteStoredClassNames rides along: its exact-match updates are the claim to prove off SQLite.
      - name: Run support tests
        run: vendor/bin/phpunit --filter 'Support|AiRunResource|RewriteStoredClassNames'

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  # Branch protection requires this one name, so a matrix bump never renames
  # the required check.
  lint-and-test:
    name: Lint & Test
    needs: [tests, filament, no-optional, pgsql, lint, analyse]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished as '$result'; all six must succeed." >&2
              exit 1
            fi
          done
          echo "All required jobs succeeded."
